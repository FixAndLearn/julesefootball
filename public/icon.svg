<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e3a8a" />
      <stop offset="45%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Hex Shield Crest -->
  <path
    d="M32 5L56 13V29C56 43.9 45.7 57.1 32 61C18.3 57.1 8 43.9 8 29V13L32 5Z"
    fill="url(#shieldGrad)"
    stroke="url(#goldGrad)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Dark Inner Field -->
  <path
    d="M32 9.5L52 16.5V29C52 41.5 43.5 52.8 32 56.5C20.5 52.8 12 41.5 12 29V16.5L32 9.5Z"
    fill="#080e1e"
  />

  <!-- Soccer Ball Outline -->
  <circle cx="32" cy="29" r="13" stroke="url(#neonGrad)" stroke-width="2.2" fill="#0f1f42" />

  <!-- Center Ball Pentagram Panel -->
  <polygon
    points="32,22 37,26 35,32 29,32 27,26"
    fill="url(#goldGrad)"
  />

  <!-- Seam Lines -->
  <line x1="32" y1="22" x2="32" y2="16" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="37" y1="26" x2="43" y2="24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="35" y1="32" x2="41" y2="37" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="29" y1="32" x2="23" y2="37" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="27" y1="26" x2="21" y2="24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Escrow Vault Lock at bottom tip -->
  <g transform="translate(26, 42)">
    <rect x="1.5" y="4.5" width="9" height="7" rx="2" fill="#f59e0b" stroke="#fbbf24" stroke-width="1" />
    <path
      d="M3.5 4.5V2.8C3.5 1.5 4.6 0.5 6 0.5C7.4 0.5 8.5 1.5 8.5 2.8V4.5"
      stroke="#fbbf24"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <circle cx="6" cy="8" r="1" fill="#080e1e" />
  </g>
</svg>
